<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmPulse - 生理監控與量測</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- MediaPipe Face Mesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f8f9fa; margin: 0; padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { color: #1DB954; margin-bottom: 8px; }
    .video-wrapper { position: relative; width: 320px; height: 320px; margin: 15px auto; border-radius: 50%; overflow: hidden; border: 4px solid #1DB954; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; background: #e9ecef; color: #495057; margin-bottom: 10px; }
    .btn { background: #1DB954; color: white; border: none; padding: 12px 28px; border-radius: 24px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 280px; }
    .btn:disabled { background: #adb5bd; cursor: not-allowed; }

    /* Modal 樣式 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 9999; }
    .modal-box { background: white; width: 88%; max-width: 400px; padding: 24px; border-radius: 16px; text-align: left; max-height: 80vh; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>PharmPulse 脈搏量測</h2>
    <p style="color: #6c757d; font-size: 14px;">請將臉部置於框內並保持靜止</p>
    
    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div id="status" class="status-badge">初始化鏡頭與對焦系統...</div>
    <br>
    <button id="start-btn" class="btn" disabled onclick="startMeasurement()">開始 10 秒量測</button>
  </div>

  <!-- 免責聲明與隱私條款 Modal -->
  <div id="consent-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-top:0; color:#1DB954;">服務條款與隱私聲明</h3>
      <div style="font-size:13px; color:#495057; line-height:1.6; border:1px solid #e9ecef; padding:12px; border-radius:8px; background:#f8f9fa; margin-bottom:15px;">
        <strong>一、生理數據採集與分析</strong><br>
        本服務透過影像遠端光學心率 (rPPG) 技術採集您的臉部影像訊號，僅用於即時心率與壓力指數評估。<br><br>
        <strong>二、醫療免責聲明 (Medical Disclaimer)</strong><br>
        PharmPulse 所提供之生理數據結果<strong>不構成任何醫療診斷、處方或處置建議</strong>。若感到身體不適，請務必尋求專業醫師診治。<br><br>
        <strong>三、個資保護與數據加密</strong><br>
        您的生理數據將採用去識別化 (Pseudonymization) 機制進行安全防護，不會向未授權第三方透露。
      </div>
      <button onclick="acceptTerms()" style="width:100%; background:#1DB954; color:white; border:none; padding:12px; border-radius:24px; font-weight:bold; font-size:16px; cursor:pointer;">我已閱讀並同意條款</button>
    </div>
  </div>

  <script>
    let userLineId = "U_TEST_USER";
    let idToken = "TEST_TOKEN";
    let isFaceDetected = false;
    let isMeasuring = false;
    let hasAgreedTerms = false;
    let rgbSignals = [[], [], []];

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');

    // 初始化 LIFF
    async function initLIFF() {
      try {
        await liff.init({ liffId: "YOUR_LIFF_ID" }); // 請替換為您的 LIFF ID
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userLineId = profile.userId;
          idToken = liff.getIDToken() || "TEST_TOKEN";
        }
      } catch (err) {
        console.log("LIFF 模式初始化 (或測試環境)", err);
      } finally {
        checkUserConsent();
      }
    }
    initLIFF();

    // 查驗條款同意狀態
    async function checkUserConsent() {
      try {
        const res = await fetch(`/api/v1/user/consent-status/${userLineId}`);
        const data = await res.json();
        if (data.agreed) {
          hasAgreedTerms = true;
        } else {
          document.getElementById('consent-modal').style.display = 'flex';
        }
      } catch (e) {
        console.error("Check consent error", e);
      }
    }

    // 簽署條款
    async function acceptTerms() {
      try {
        const res = await fetch('/api/v1/user/consent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_line_id: userLineId,
            id_token: idToken,
            terms_version: "v1.0"
          })
        });
        const data = await res.json();
        if (data.status === "success") {
          hasAgreedTerms = true;
          document.getElementById('consent-modal').style.display = 'none';
          if (isFaceDetected) startBtn.disabled = false;
        }
      } catch (err) {
        alert("條款簽署失敗，請重新嘗試");
      }
    }

    // MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        isFaceDetected = true;
        const landmarks = results.multiFaceLandmarks[0];

        if (!isMeasuring) {
          statusText.innerText = "臉部已對準，請點擊開始量測";
          statusText.style.background = "#d4edda";
          statusText.style.color = "#155724";
          if (hasAgreedTerms) startBtn.disabled = false;
        }

        if (isMeasuring) {
          sampleROIColor(landmarks);
        }
      } else {
        isFaceDetected = false;
        if (!isMeasuring) {
          statusText.innerText = "未偵測到臉部，請對準鏡頭";
          statusText.style.background = "#f8d7da";
          statusText.style.color = "#721c24";
          startBtn.disabled = true;
        }
      }
      canvasCtx.restore();
    }

    // 額頭特徵點 (Index 10) 顏色採樣
    function sampleROIColor(landmarks) {
      const foreheadIndex = 10;
      const x = Math.floor(landmarks[foreheadIndex].x * canvasElement.width);
      const y = Math.floor(landmarks[foreheadIndex].y * canvasElement.height);

      try {
        const imgData = canvasCtx.getImageData(Math.max(0, x - 10), Math.max(0, y - 10), 20, 20);
        let rSum = 0, gSum = 0, bSum = 0;
        const totalPixels = imgData.data.length / 4;

        for (let i = 0; i < imgData.data.length; i += 4) {
          rSum += imgData.data[i];
          gSum += imgData.data[i + 1];
          bSum += imgData.data[i + 2];
        }

        rgbSignals[0].push(rSum / totalPixels);
        rgbSignals[1].push(gSum / totalPixels);
        rgbSignals[2].push(bSum / totalPixels);
      } catch (e) {
        console.error("ROI sampling error", e);
      }
    }

    // 啟動相機
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();

    // 10 秒量測流程
    async function startMeasurement() {
      if (!isFaceDetected || !hasAgreedTerms) return;

      isMeasuring = true;
      startBtn.disabled = true;
      rgbSignals = [[], [], []];

      let countdown = 10;
      statusText.style.background = "#fff3cd";
      statusText.style.color = "#856404";

      const timer = setInterval(() => {
        countdown--;
        statusText.innerText = `量測中... 剩餘 ${countdown} 秒 (請保持靜止)`;

        if (countdown <= 0) {
          clearInterval(timer);
          isMeasuring = false;
          submitData();
        }
      }, 1000);
    }

    // 數據提交
    async function submitData() {
      statusText.innerText = "加密分析中，請稍候...";
      try {
        const response = await fetch('/api/v1/analyze-rppg', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_line_id: userLineId,
            id_token: idToken,
            rgb_signals: rgbSignals,
            fps: 30
          })
        });

        const resData = await response.json();
        if (resData.status === "success") {
          statusText.innerText = `量測完成！心率：${resData.data.heart_rate} BPM`;
          statusText.style.background = "#d4edda";
          statusText.style.color = "#155724";
          alert(`量測成功！\n心率：${resData.data.heart_rate} BPM\n報告已推送至您的 LINE 聊天室。`);
        } else {
          throw new Error("API error");
        }
      } catch (err) {
        statusText.innerText = "分析失敗，請重新嘗試";
        statusText.style.background = "#f8d7da";
        alert("分析發生錯誤，請重試");
      } finally {
        startBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
