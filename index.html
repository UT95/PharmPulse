<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmPulse 藥局端健康關懷與調閱系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

  <!-- Header / Navbar -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-notes-medical text-2xl text-emerald-200"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">PharmPulse 藥局端關懷系統</h1>
          <p class="text-xs text-emerald-100">社區藥局生理即時追蹤與照護平台</p>
        </div>
      </div>
      <button onclick="fetchAlerts(); fetchRecentRecords()" class="bg-emerald-800 hover:bg-emerald-900 text-emerald-100 text-sm px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
        <i class="fa-solid fa-rotate-right"></i> 重新整理
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Left Column: Pending Alerts (2 cols on large screen) -->
    <section class="lg:col-span-2 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
          <h2 class="text-lg font-bold text-slate-800">待處置紅/黃燈警示個案</h2>
        </div>
        <span id="alert-count" class="bg-slate-200 text-slate-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">載入中...</span>
      </div>

      <!-- Alert Cards Container -->
      <div id="alerts-container" class="space-y-4">
        <div class="text-center py-12 text-slate-400 bg-white rounded-xl shadow-sm border border-slate-100">
          <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-600"></i>
          <p>正在載入緊急關懷卡片...</p>
        </div>
      </div>

      <div class="pt-4">
        <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-emerald-600"></i>
            <h2 class="text-lg font-bold text-slate-800">最近居家量測紀錄</h2>
          </div>
          <span id="recent-count" class="bg-slate-200 text-slate-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">載入中...</span>
        </div>
        <div id="recent-records-container" class="space-y-3">
          <div class="text-center py-8 text-slate-400 bg-white rounded-xl shadow-sm border border-slate-100">
            <i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-emerald-600"></i>
            <p>正在載入最近量測紀錄...</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Right Column: Patient Lookup Trigger -->
    <section class="space-y-4">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-qrcode text-emerald-600"></i> 掃碼 / 查詢民眾 7 天紀錄
        </h2>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">民眾 LINE User ID (或掃描 QR Code)</label>
          <div class="flex gap-2">
            <input type="text" id="lookup-line-id" placeholder="例如：U1234567890..." 
                   class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button id="search-btn" onclick="fetchPatientHistory()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
              <i class="fa-solid fa-magnifying-glass"></i> 查詢
            </button>
          </div>
        </div>

        <div class="p-4 bg-emerald-50 border border-emerald-100 rounded-lg text-xs text-emerald-800 space-y-1">
          <p class="font-bold flex items-center gap-1"><i class="fa-solid fa-circle-info"></i> 操作提示：</p>
          <p>輸入或掃描民眾 ID 後，系統將會彈出<strong>專屬健康分析畫面</strong>，即時顯示 7 天心率與壓力變化趨勢圖。</p>
        </div>
      </div>
    </section>

  </main>

  <!-- 🎯 獨立大畫面彈窗 (Patient Detail Modal) -->
  <div id="patient-detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-100">
      
      <!-- Modal Header -->
      <div class="bg-emerald-700 text-white px-6 py-4 flex justify-between items-center">
        <div>
          <h3 class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-chart-line text-emerald-200"></i> 民眾近 7 天健康數據分析
          </h3>
          <p class="text-xs text-emerald-100 mt-0.5">個案 ID: <span id="modal-patient-id" class="font-mono font-bold">---</span></p>
        </div>
        <button onclick="closePatientModal()" class="text-emerald-100 hover:text-white hover:bg-emerald-800/50 w-8 h-8 rounded-full flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Modal Body (可滾動區域) -->
      <div class="p-6 overflow-y-auto space-y-6 flex-1 bg-slate-50/50">
        
        <!-- 上半部：7 天心率趨勢圖 -->
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
              <i class="fa-solid fa-heart-pulse text-red-500"></i> 7 天心率趨勢變化 (BPM)
            </h4>
            <span id="modal-total-records" class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full">載入中...</span>
          </div>
          
          <!-- Chart Container (高度固定 240px) -->
          <div class="relative w-full h-60">
            <canvas id="modalHeartRateChart"></canvas>
          </div>
        </div>

        <!-- 下半部：詳細歷史紀錄明細 -->
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
          <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-emerald-600"></i> 詳細檢測歷史紀錄
          </h4>
          <div id="modal-history-list" class="space-y-2.5">
            <!-- 歷史紀錄項目將在此動態生成 -->
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="bg-slate-100 border-t border-slate-200 px-6 py-3 flex justify-end">
        <button onclick="closePatientModal()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs px-5 py-2 rounded-lg font-medium transition">
          關閉視窗
        </button>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = "/api/v1";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
    let modalChartInstance = null; // 全域圖表實例

    // 1. 載入待關懷警示卡片
    async function fetchAlerts() {
      const container = document.getElementById("alerts-container");
      const countBadge = document.getElementById("alert-count");

      try {
        const res = await fetch(`${API_BASE}/pharmacy/alerts`);
        const data = await res.json();

        if (data.status !== "success" || !data.alerts || data.alerts.length === 0) {
          container.innerHTML = `
            <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500">
              <i class="fa-solid fa-circle-check text-4xl text-emerald-500 mb-3"></i>
              <p class="font-medium">目前無待處理的紅/黃燈個案</p>
              <p class="text-xs text-slate-400 mt-1">社區居民生理狀況皆維持良好狀態</p>
            </div>`;
          countBadge.textContent = "0 筆待處理";
          return;
        }

        countBadge.textContent = `${data.alerts.length} 筆待處理`;
        container.innerHTML = data.alerts.map(item => buildAlertCard(item)).join("");

      } catch (err) {
        console.error("Fetch Alerts Error:", err);
        container.innerHTML = `<div class="bg-red-50 p-4 rounded-xl text-red-600 text-sm">載入資料失敗，請確認後端服務是否正常運行。</div>`;
      }
    }


    // 1A. 載入最近所有居家量測紀錄（GREEN/YELLOW/RED）
    async function fetchRecentRecords() {
      const container = document.getElementById("recent-records-container");
      const badge = document.getElementById("recent-count");

      try {
        const res = await fetch(`${API_BASE}/pharmacy/recent?limit=30`);
        const data = await res.json();
        if (data.status !== "success") throw new Error(data.message || "載入失敗");

        const records = Array.isArray(data.records) ? data.records : [];
        badge.textContent = `${records.length} 筆`;

        if (!records.length) {
          container.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 text-center text-slate-500 text-sm">目前尚無任何居家量測紀錄。</div>`;
          return;
        }

        container.innerHTML = records.map(item => {
          const light = item.health_light || "GREEN";
          const meta = light === "RED"
            ? ["🔴", "RED", "bg-red-50 border-red-200 text-red-700"]
            : light === "YELLOW"
              ? ["🟡", "YELLOW", "bg-amber-50 border-amber-200 text-amber-700"]
              : ["🟢", "GREEN", "bg-emerald-50 border-emerald-200 text-emerald-700"];
          const timeStr = item.created_at ? new Date(item.created_at).toLocaleString("zh-TW") : "未知時間";
          const lineId = String(item.user_line_id || "");
          return `
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
                <div class="flex items-center gap-2">
                  <span class="text-xs px-2 py-1 rounded-full border font-bold ${meta[2]}">${meta[0]} ${meta[1]}</span>
                  <span class="font-mono text-xs text-slate-600">${escapeHtml(lineId)}</span>
                </div>
                <span class="text-xs text-slate-400">${timeStr}</span>
              </div>
              <div class="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-lg text-sm">
                <div><span class="text-xs text-slate-500">心率</span><p class="font-bold">${item.heart_rate ?? "--"} BPM</p></div>
                <div><span class="text-xs text-slate-500">HRV</span><p class="font-bold">${item.hrv_sdnn ?? "--"} ms</p></div>
                <div><span class="text-xs text-slate-500">壓力</span><p class="font-bold">${item.stress_score ?? "--"} / 100</p></div>
              </div>
              <p class="text-xs text-slate-500 mt-2">${escapeHtml(item.summary || "無摘要")}</p>
              <div class="mt-3 flex justify-end">
                <button onclick="quickLookup('${lineId.replace(/'/g, "\\'")}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-lg font-medium transition">
                  <i class="fa-solid fa-chart-line"></i> 查看 7 天趨勢
                </button>
              </div>
            </div>`;
        }).join("");
      } catch (err) {
        console.error("Fetch Recent Records Error:", err);
        container.innerHTML = `<div class="bg-red-50 p-4 rounded-xl text-red-600 text-sm">最近量測資料載入失敗：${escapeHtml(err.message || "未知錯誤")}</div>`;
        badge.textContent = "載入失敗";
      }
    }

    // 2. 建立卡片 HTML
    function buildAlertCard(item) {
      const isRed = item.health_light === "RED";
      const badgeBg = isRed ? "bg-red-100 text-red-700 border-red-200" : "bg-amber-100 text-amber-700 border-amber-200";
      const lightTitle = isRed ? "🔴 高度警示 (RED)" : "🟡 輕度風險 (YELLOW)";
      const timeStr = item.created_at ? new Date(item.created_at).toLocaleString("zh-TW") : "剛剛";

      return `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3 relative hover:shadow-md transition">
          <div class="flex justify-between items-start">
            <div>
              <span class="inline-block text-xs px-2.5 py-1 rounded-full border font-bold ${badgeBg}">
                ${lightTitle}
              </span>
              <p class="text-xs text-slate-400 mt-1">個案 ID: <span class="font-mono text-slate-600">${item.user_line_id}</span></p>
            </div>
            <span class="text-xs text-slate-400">${timeStr}</span>
          </div>

          <!-- Metrics -->
          <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-lg text-sm">
            <div>
              <span class="text-xs text-slate-500">心率 (Heart Rate)</span>
              <p class="font-bold text-slate-800 text-lg">${item.heart_rate} <span class="text-xs font-normal">BPM</span></p>
            </div>
            <div>
              <span class="text-xs text-slate-500">壓力指數 (Stress)</span>
              <p class="font-bold text-slate-800 text-lg">${item.stress_score} <span class="text-xs font-normal">/ 100</span></p>
            </div>
          </div>

          <!-- Summary & Advice -->
          <div class="text-xs text-slate-600 space-y-1">
            <p><strong class="text-slate-700">檢測摘要：</strong>${item.summary || '無摘要'}</p>
            <p class="bg-amber-50 text-amber-900 p-2.5 rounded-lg border border-amber-100">
              <strong class="text-amber-800">處置建議：</strong>${item.action_advice || '建議進行臨櫃詢問與衛教。'}
            </p>
          </div>

          <!-- Action Button -->
          <div class="pt-1 flex justify-end gap-2">
            <button onclick="quickLookup('${item.user_line_id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
              <i class="fa-solid fa-chart-line"></i> 查看 7 天趨勢
            </button>
            <button onclick="resolveAlert(${item.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-4 py-2 rounded-lg font-medium transition flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-check"></i> 標示已關懷
            </button>
          </div>
        </div>`;
    }

    // 3. 標示已關懷
    async function resolveAlert(recordId) {
      try {
        const res = await fetch(`${API_BASE}/pharmacy/resolve/${recordId}`, { method: "POST" });
        const data = await res.json();
        if (data.status === "success") {
          fetchAlerts();
        } else {
          alert("更新狀態失敗：" + data.message);
        }
      } catch (err) {
        alert("請求發送失敗，請檢查後端連線");
      }
    }

    // 4. 快速帶入 ID 並查詢
    function quickLookup(lineId) {
      document.getElementById("lookup-line-id").value = lineId;
      fetchPatientHistory();
    }

    // 5. 調閱 7 天歷史紀錄並開啟獨立彈窗畫面
    async function fetchPatientHistory() {
      const lineId = document.getElementById("lookup-line-id").value.trim();
      const btn = document.getElementById("search-btn");

      if (!lineId) {
        alert("請輸入或掃描民眾的 LINE User ID");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 查詢中...`;

      try {
        const res = await fetch(`${API_BASE}/pharmacy/patient/${encodeURIComponent(lineId)}/history`);
        const data = await res.json();

        const history = Array.isArray(data.history)
          ? data.history
          : (Array.isArray(data.records) ? data.records : []);

        if (data.status !== "success" || history.length === 0) {
          alert(data.message ? `查詢失敗：${data.message}` : "該民眾近 7 天無檢測紀錄。");
          return;
        }

        data.history = history;
        data.total_records = data.total_records || history.length;
        openPatientModal(lineId, data);

      } catch (err) {
        console.error("Fetch Patient History Error:", err);
        alert("查詢失敗，請檢查系統與後端狀態。");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> 查詢`;
      }
    }

    // 6. 開啟彈窗與填充內容
    function openPatientModal(lineId, data) {
      document.getElementById("modal-patient-id").textContent = lineId;
      document.getElementById("modal-total-records").textContent = `共 ${data.total_records || data.history.length} 筆紀錄`;

      const historyListDiv = document.getElementById("modal-history-list");
      historyListDiv.innerHTML = "";

      // 填充歷史紀錄清單
      data.history.forEach(r => {
        const lightBg = r.health_light === "RED" ? "bg-red-50 border-red-200 text-red-800" : (r.health_light === "YELLOW" ? "bg-amber-50 border-amber-200 text-amber-800" : "bg-emerald-50 border-emerald-200 text-emerald-800");
        const timeStr = r.created_at ? new Date(r.created_at).toLocaleString("zh-TW") : "未知時間";

        const div = document.createElement("div");
        div.className = `p-3 rounded-xl border text-xs space-y-1.5 ${lightBg}`;
        div.innerHTML = `
          <div class="flex justify-between items-center font-bold">
            <span class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${r.health_light === 'RED' ? 'bg-red-500' : (r.health_light === 'YELLOW' ? 'bg-amber-500' : 'bg-emerald-500')}"></span>
              ${r.health_light} 燈號狀態
            </span>
            <span class="text-slate-400 font-normal">${timeStr}</span>
          </div>
          <div class="grid grid-cols-3 gap-2 pt-1 border-t border-slate-200/50 text-slate-700">
            <div>心率: <strong class="text-slate-900">${r.heart_rate} BPM</strong></div>
            <div>壓力指數: <strong class="text-slate-900">${r.stress_score} / 100</strong></div>
            <div>HRV (SDNN): <strong class="text-slate-900">${r.hrv_sdnn || '--'} ms</strong></div>
          </div>
        `;
        historyListDiv.appendChild(div);
      });

      // 顯示 Modal 彈窗
      const modal = document.getElementById("patient-detail-modal");
      modal.classList.remove("hidden");

      // 繪製趨勢圖 (延遲一瞬間確保 Modal Canvas 已完全渲染)
      setTimeout(() => {
        renderModalChart(data.history);
      }, 50);
    }

    // 7. 關閉彈窗
    function closePatientModal() {
      const modal = document.getElementById("patient-detail-modal");
      modal.classList.add("hidden");
    }

    // 8. 繪製彈窗心率折線圖 (Chart.js)
    // 8. 繪製彈窗心率折線圖 (Chart.js 視覺優化版)
// 8. 繪製彈窗心率折線圖 (極簡無點平滑折線版)
function renderModalChart(historyData) {
  const canvas = document.getElementById('modalHeartRateChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // 時間舊 -> 新排序
  const sortedData = [...historyData].reverse();

  const labels = sortedData.map(item => {
    if (!item.created_at) return '未知';
    const d = new Date(item.created_at);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  });

  const heartRates = sortedData.map(item => item.heart_rate || item.bpm || 0);

  // 建立折線下方柔和漸層
  const gradient = ctx.createLinearGradient(0, 0, 0, 240);
  gradient.addColorStop(0, 'rgba(16, 185, 129, 0.2)');
  gradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

  if (modalChartInstance) {
    modalChartInstance.destroy();
  }

  modalChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: '心率 (BPM)',
        data: heartRates,
        borderColor: '#059669',            // 綠色折線 (Emerald 600)
        borderWidth: 3,                    // 線條加粗增強視覺質感
        backgroundColor: gradient,
        fill: true,
        tension: 0.35,                     // 平滑曲線
        // 🎯 隱藏常駐點點
        pointRadius: 0,                    // 平時完全不顯示點點
        pointHoverRadius: 7,               // 滑鼠靠近時才顯示亮點
        pointHoverBackgroundColor: '#047857',
        pointHoverBorderColor: '#ffffff',
        pointHoverBorderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,                  // 只要滑鼠移動到該 X 軸區間就會觸發懸浮顯示
      },
      scales: {
        y: {
          beginAtZero: false,
          suggestedMin: 50,
          suggestedMax: 130,
          grid: {
            color: (context) => {
              // 標示正常心率範圍 (60 與 100 BPM) 的參考警示線
              if (context.tick.value === 60 || context.tick.value === 100) {
                return 'rgba(239, 68, 68, 0.25)';
              }
              return 'rgba(226, 232, 240, 0.6)';
            },
            lineWidth: (context) => (context.tick.value === 60 || context.tick.value === 100 ? 1.5 : 1)
          },
          ticks: {
            font: { size: 11, weight: '500' },
            color: '#64748b',
            callback: (val) => `${val} BPM`
          }
        },
        x: {
          grid: { display: false },
          ticks: {
            maxRotation: 30,
            font: { size: 10 },
            color: '#64748b'
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(15, 23, 42, 0.9)', // 暗色質感 Tooltip
          titleFont: { size: 12, weight: 'bold' },
          bodyFont: { size: 12 },
          padding: 12,
          cornerRadius: 8,
          displayColors: false,
          callbacks: {
            title: (items) => `📅 時間：${items[0].label}`,
            label: (context) => {
              const rawItem = sortedData[context.dataIndex];
              const lightEmoji = rawItem.health_light === 'RED' ? '🔴' : (rawItem.health_light === 'YELLOW' ? '🟡' : '🟢');
              return [
                `${lightEmoji} 燈號狀態：${rawItem.health_light || 'NORMAL'}`,
                `❤ 心率數值：${rawItem.heart_rate} BPM`,
                `⚡ 壓力指數：${rawItem.stress_score ?? '--'} / 100`
              ];
            }
          }
        }
      }
    }
  });
}

    // 按下 ESC 鍵自動關閉彈窗
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePatientModal();
    });

    // 初始化載入
    window.onload = () => {
      fetchAlerts();
      fetchRecentRecords();
    };
  </script>
</body>
</html>
