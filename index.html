<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmPulse 生理量測</title>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- MediaPipe Face Mesh SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; color: #333; padding: 20px; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1DB446; margin-bottom: 8px; font-size: 22px; }
        .user-info { font-size: 14px; color: #666; margin-bottom: 12px; background: #eef9f2; padding: 8px 12px; border-radius: 8px; display: inline-block; word-break: break-all; }
        
        .nav-actions { margin-bottom: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn-secondary { background-color: #ffffff; color: #1DB446; border: 1.5px solid #1DB446; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-secondary:active { background-color: #eef9f2; transform: scale(0.98); }

        /* QR Code 卡片樣式 */
        .qrcode-card { display: none; background: #f0fdf4; border: 1.5px dashed #1DB446; border-radius: 12px; padding: 16px; margin-bottom: 16px; text-align: center; transition: all 0.3s ease; }
        .qrcode-title { font-weight: bold; color: #166534; font-size: 15px; margin-bottom: 4px; }
        .qrcode-sub { font-size: 12px; color: #666; margin-bottom: 10px; }
        .qrcode-box { display: inline-flex; justify-content: center; align-items: center; margin: 10px 0; background: #ffffff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .qrcode-id { font-size: 12px; color: #333; background: #e2e8f0; padding: 4px 10px; border-radius: 6px; display: inline-block; font-family: monospace; font-weight: 600; }

        /* 視訊與人臉綠光 ROI 區域 */
        .camera-container { position: relative; width: 280px; height: 280px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; background-color: #000; border: 4px solid #1DB446; box-shadow: 0 8px 16px rgba(29, 180, 70, 0.2); }
        /* 讓原始相機預覽永遠在底層可見：即使 MediaPipe 尚未回傳，使用者也不會只看到黑畫面。 */
        #webcam, #output-canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #webcam { display: block; z-index: 1; background: #000; }
        #output-canvas { z-index: 2; background: transparent; }
        .face-overlay { position: absolute; z-index: 3; top: 0; left: 0; width: 100%; height: 100%; border: 4px dashed rgba(255, 255, 255, 0.85); border-radius: 50%; pointer-events: none; box-sizing: border-box; animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { border-color: rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3); }
            50% { border-color: rgba(29, 180, 70, 1); box-shadow: inset 0 0 25px rgba(29, 180, 70, 0.6); }
            100% { border-color: rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3); }
        }

        .progress-bar-container { width: 100%; background-color: #e5e7eb; border-radius: 8px; height: 10px; margin-bottom: 15px; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 100%; background-color: #1DB446; transition: width 0.1s linear; }

        .btn { width: 100%; padding: 14px; background-color: #1DB446; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .btn:active { background-color: #159338; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .status { margin-top: 15px; font-size: 15px; color: #555; font-weight: 500; min-height: 22px; }

        .report-card { display: none; margin-top: 20px; padding: 16px; border-radius: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; text-align: left; }
        .report-card.yellow { background: #fefce8; border-color: #fef08a; }
        .report-card.red { background: #fef2f2; border-color: #fecaca; }
        .report-title { font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #166534; }
        .report-metric { font-size: 15px; margin-bottom: 6px; }
        .report-section { margin-top: 10px; font-size: 14px; line-height: 1.5; white-space: pre-line; }

        /* 歷史紀錄彈窗 Modal CSS */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 20px; border-radius: 16px; width: 90%; max-width: 440px; max-height: 80vh; overflow-y: auto; text-align: left; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { font-size: 24px; font-weight: bold; cursor: pointer; color: #888; }
        .history-item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .history-date { font-size: 12px; color: #888; margin-bottom: 4px; }
        .history-body { font-size: 14px; font-weight: bold; color: #333; }
        .chart-container { position: relative; height: 200px; width: 100%; margin-bottom: 15px; padding: 10px; background: #fafafa; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>PharmPulse 生理檢測</h2>
        <div id="user-info" class="user-info">連線中...</div>
        
        <div class="nav-actions">
            <button class="btn-secondary" onclick="toggleQrCode()">📱 出示藥局條碼</button>
            <button class="btn-secondary" onclick="fetchAndShowHistory()">📊 查看歷史紀錄</button>
        </div>

        <!-- 專屬 LINE ID QR Code 卡片 -->
        <div id="qrcode-card" class="qrcode-card">
            <div class="qrcode-title">🏥 社區藥局專屬關懷 QR Code</div>
            <div class="qrcode-sub">前往藥局時，請出示此條碼供藥師掃描調閱紀錄</div>
            <div class="qrcode-box">
                <div id="qrcode-container"></div>
            </div>
            <div>
                <span id="display-line-id" class="qrcode-id">ID: 載入中...</span>
            </div>
        </div>

        <div id="profile-card" style="margin:12px 0 12px; padding:14px; border:1px solid #e2e8f0; background:#ffffff; border-radius:12px; text-align:left;">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">
                <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">👤 個人慢性病監測檔案</div>
                    <div id="profile-summary" style="font-size:12px;color:#64748b;margin-top:4px;">尚未建立，建立後會自動套用監測模式。</div>
                </div>
                <button type="button" onclick="openProfileEditor()" style="border:none;background:#0f766e;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;">設定</button>
            </div>
        </div>

        <div style="margin:12px 0 16px; padding:14px; border:1px solid #d1fae5; background:#f0fdf4; border-radius:12px; text-align:left;">
            <label for="monitoring-mode" style="display:block;font-size:13px;font-weight:700;color:#166534;margin-bottom:6px;">🩺 慢性病監測模式</label>
            <select id="monitoring-mode" onchange="updateMonitoringModeHint()" style="width:100%;padding:10px;border-radius:9px;border:1px solid #bbf7d0;background:#fff;font-size:14px;color:#334155;">
                <option value="GENERAL">一般健康監測</option>
                <option value="CARDIO">高血壓 / 心血管監測</option>
                <option value="RESPIRATORY">COPD / 呼吸慢病監測</option>
            </select>
            <div id="monitoring-mode-hint" style="margin-top:7px;font-size:12px;line-height:1.45;color:#64748b;">日常追蹤心率、HRV、呼吸與壓力趨勢。</div>
        </div>

        <div class="camera-container">
            <video id="webcam" playsinline muted></video>
            <canvas id="output-canvas" width="640" height="640"></canvas>
            <div class="face-overlay"></div>
        </div>

        <div id="progress-container" class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <button id="start-btn" class="btn" onclick="startMeasurement()">開始真實生理量測</button>
        <p id="status-text" class="status">請對準頭部並保持靜止，點擊按鈕開始量測</p>

        <div id="report-card" class="report-card">
            <div id="report-title" class="report-title">🟢 量測結果報告</div>
            <div id="report-metrics" class="report-metric"></div>
            <hr style="margin: 8px 0; border: none; border-top: 1px solid rgba(0,0,0,0.1);">
            <div id="report-summary" class="report-section"></div>
            <div id="report-advice" class="report-section" style="font-weight: 500;"></div>
        </div>
    </div>

    <div id="profile-modal" class="modal" onclick="handleProfileModalOutsideClick(event)">
        <div class="modal-content" style="max-width:520px;">
            <div class="modal-header">
                <h3>👤 個人慢性病監測檔案</h3>
                <span class="close-btn" onclick="closeProfileEditor()">&times;</span>
            </div>

            <div style="text-align:left;display:grid;gap:12px;">
                <div>
                    <label style="font-size:12px;font-weight:700;color:#475569;">主要監測類型</label>
                    <select id="profile-monitoring-mode" style="width:100%;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;">
                        <option value="GENERAL">一般健康監測</option>
                        <option value="CARDIO">高血壓 / 心血管監測</option>
                        <option value="RESPIRATORY">COPD / 呼吸慢病監測</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:12px;font-weight:700;color:#475569;">慢性病 / 健康狀況（自行填寫）</label>
                    <textarea id="profile-conditions" rows="3" placeholder="例如：高血壓、COPD；沒有可留白" style="width:100%;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;resize:vertical;"></textarea>
                </div>
                <div>
                    <label style="font-size:12px;font-weight:700;color:#475569;">目前用藥備註（選填）</label>
                    <textarea id="profile-medication" rows="2" placeholder="例如：固定服用降壓藥；不需輸入完整處方也可" style="width:100%;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;resize:vertical;"></textarea>
                </div>
                <div>
                    <label style="font-size:12px;font-weight:700;color:#475569;">照護備註（選填）</label>
                    <textarea id="profile-care-note" rows="2" placeholder="例如：希望藥師優先以 LINE 關懷" style="width:100%;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;resize:vertical;"></textarea>
                </div>
                <div style="font-size:11px;color:#64748b;line-height:1.5;background:#f8fafc;border-radius:8px;padding:10px;">
                    此檔案為使用者自述與監測分流用途，不代表醫療診斷。高血壓仍需以合格血壓計確認；SpO₂ 為實驗性估值。
                </div>
                <button type="button" onclick="saveChronicProfile()" class="btn">儲存個人檔案</button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄 Modal -->
    <div id="history-modal" class="modal" onclick="handleModalOutsideClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📊 歷史量測紀錄</h3>
                <span class="close-btn" onclick="closeHistoryModal()">&times;</span>
            </div>

            <!-- 📈 心率趨勢圖畫布容器 -->
            <div class="chart-container">
                <canvas id="heartRateChart"></canvas>
            </div>

            <div id="history-list">
                <p style="text-align:center; color:#888;">讀取中...</p>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = "";

        const monitoringModeInfo = {
            GENERAL: { label: "一般健康監測", hint: "日常追蹤心率、HRV、呼吸與壓力趨勢。" },
            CARDIO: { label: "高血壓 / 心血管監測", hint: "著重心率、脈搏規律與 HRV 趨勢；高血壓仍需搭配合格血壓計確認。" },
            RESPIRATORY: { label: "COPD / 呼吸慢病監測", hint: "著重呼吸頻率與心肺負荷；SpO₂ 為實驗性估值，不作醫療判斷。" }
        };

        let chronicProfile = null;

        async function loadChronicProfile() {
            if (!currentUserId) return;
            try {
                const res = await fetch(`/api/v1/user/chronic-profile/${encodeURIComponent(currentUserId)}`);
                const data = await res.json();
                if (data.status !== "success" || !data.profile) return;

                chronicProfile = data.profile;
                const mode = chronicProfile.monitoring_mode || "GENERAL";
                const select = document.getElementById("monitoring-mode");
                if (select && monitoringModeInfo[mode]) {
                    select.value = mode;
                    select.disabled = !!data.exists;
                    select.style.opacity = data.exists ? "0.75" : "1";
                    select.title = data.exists ? "已由個人慢性病檔案自動套用；請至個人檔案修改。" : "";
                }

                const summary = document.getElementById("profile-summary");
                if (summary) {
                    if (data.exists) {
                        const conditions = chronicProfile.chronic_conditions ? `｜${chronicProfile.chronic_conditions}` : "";
                        summary.textContent = `${chronicProfile.monitoring_mode_label || monitoringModeInfo[mode].label}${conditions}`;
                    } else {
                        summary.textContent = "尚未建立，建立後會自動套用監測模式。";
                    }
                }
                updateMonitoringModeHint();
            } catch (err) {
                console.error("Load chronic profile error:", err);
            }
        }

        function openProfileEditor() {
            const modal = document.getElementById("profile-modal");
            if (!modal) return;
            const mode = chronicProfile?.monitoring_mode || getMonitoringMode();
            document.getElementById("profile-monitoring-mode").value = mode;
            document.getElementById("profile-conditions").value = chronicProfile?.chronic_conditions || "";
            document.getElementById("profile-medication").value = chronicProfile?.medication_note || "";
            document.getElementById("profile-care-note").value = chronicProfile?.care_note || "";
            modal.style.display = "flex";
        }

        function closeProfileEditor() {
            const modal = document.getElementById("profile-modal");
            if (modal) modal.style.display = "none";
        }

        function handleProfileModalOutsideClick(event) {
            if (event.target?.id === "profile-modal") closeProfileEditor();
        }

        async function saveChronicProfile() {
            if (!currentUserId) {
                alert("尚未取得 LINE 使用者資訊。");
                return;
            }

            const payload = {
                user_line_id: currentUserId,
                id_token: (typeof liff !== "undefined" && liff.isLoggedIn()) ? liff.getIDToken() : null,
                display_name: null,
                monitoring_mode: document.getElementById("profile-monitoring-mode").value,
                chronic_conditions: document.getElementById("profile-conditions").value.trim() || null,
                medication_note: document.getElementById("profile-medication").value.trim() || null,
                care_note: document.getElementById("profile-care-note").value.trim() || null
            };

            try {
                const res = await fetch("/api/v1/user/chronic-profile", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok || data.status !== "success") {
                    throw new Error(data.detail || data.message || "儲存失敗");
                }
                closeProfileEditor();
                await loadChronicProfile();
                alert("個人慢性病監測檔案已儲存。");
            } catch (err) {
                console.error(err);
                alert(`儲存失敗：${err.message}`);
            }
        }

        function getMonitoringMode() {
            return document.getElementById("monitoring-mode")?.value || "GENERAL";
        }

        function updateMonitoringModeHint() {
            const mode = getMonitoringMode();
            const info = monitoringModeInfo[mode] || monitoringModeInfo.GENERAL;
            const hint = document.getElementById("monitoring-mode-hint");
            if (hint) hint.textContent = info.hint;
            if (!chronicProfile) {
                localStorage.setItem("pharmpulse_monitoring_mode", mode);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const saved = localStorage.getItem("pharmpulse_monitoring_mode");
            const select = document.getElementById("monitoring-mode");
            if (saved && monitoringModeInfo[saved] && select) select.value = saved;
            updateMonitoringModeHint();
        });
        let historyChartInstance = null;
        
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
        
        let faceMesh;
        let cameraInstance = null; // 保留名稱相容舊程式；新版改用原生 MediaDevices
        let cameraStream = null;
        let cameraLoopRunning = false;
        let faceMeshBusy = false;
        let isMeasuring = false;
        let collectedGreenSignals = [];
        let collectedRedSignals = [];
        let collectedBlueSignals = [];
        let collectedTimestamps = [];
        const MIN_FRAMES = 250;
        const TARGET_MEASUREMENT_MS = 30000; // 30 秒標準量測，提升 RR / HRV 穩定性
        const MAX_MEASUREMENT_MS = 45000;
        let measurementStartTime = 0;
        let lastSampleTime = 0;
        let previousNosePoint = null;
        let rejectedMotionFrames = 0;
        let rejectedLightFrames = 0;

        // 生成 LINE ID QR Code
        function renderUserQRCode(userLineId) {
            const container = document.getElementById("qrcode-container");
            const displayId = document.getElementById("display-line-id");

            if (!container || !userLineId) return;

            container.innerHTML = "";
            if (displayId) {
                displayId.textContent = `ID: ${userLineId}`;
            }

            new QRCode(container, {
                text: userLineId,
                width: 160,
                height: 160,
                colorDark: "#166534",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // 切換顯示/隱藏 QR Code 卡片
        function toggleQrCode() {
            const card = document.getElementById("qrcode-card");
            card.style.display = (card.style.display === "none" || card.style.display === "") ? "block" : "none";
        }

        // 1. 初始化 LIFF 並判斷 URL 參數
        async function initLiff() {
            try {
                await liff.init({ liffId: '2011686844-4moxcFdy' }); 

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                currentUserId = profile.userId;
                document.getElementById("user-info").innerText = "👤 已連線: " + profile.displayName;

                renderUserQRCode(currentUserId);
                await loadChronicProfile();

                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('page') === 'history') {
                    fetchAndShowHistory();
                }

            } catch (err) {
                console.error("LIFF 初始化失敗:", err);
                document.getElementById("user-info").innerText = "⚠️️ 請由 LINE App 內開啟此頁面";
            }
        }

        // 2. 初始化相機與 MediaPipe Face Mesh
        // 不再完全依賴 camera_utils：先用瀏覽器原生 getUserMedia 顯示預覽，
        // 再把 video 幀送進 FaceMesh。這樣 MediaPipe 載入較慢時也不會黑畫面。
        async function startNativeCamera() {
            if (cameraStream && cameraStream.getVideoTracks().some(t => t.readyState === "live")) {
                return true;
            }

            if (!window.isSecureContext) {
                throw new Error("相機需要 HTTPS 安全連線");
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error("目前瀏覽器不支援相機存取");
            }

            cameraStream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: "user",
                    width: { ideal: 640 },
                    height: { ideal: 640 },
                    frameRate: { ideal: 30, max: 30 }
                }
            });

            videoElement.srcObject = cameraStream;
            videoElement.muted = true;
            videoElement.setAttribute("playsinline", "");
            await videoElement.play();

            document.getElementById("status-text").innerText =
                "✅ 相機已啟動，請將臉部置於圓框中央。";

            return true;
        }

        function startFaceMeshLoop() {
            if (cameraLoopRunning) return;
            cameraLoopRunning = true;

            const loop = async () => {
                if (!cameraLoopRunning) return;

                if (
                    faceMesh &&
                    videoElement.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
                    !faceMeshBusy
                ) {
                    faceMeshBusy = true;
                    try {
                        await faceMesh.send({ image: videoElement });
                    } catch (err) {
                        console.error("FaceMesh frame error:", err);
                    } finally {
                        faceMeshBusy = false;
                    }
                }

                requestAnimationFrame(loop);
            };

            requestAnimationFrame(loop);
        }

        async function initFaceMesh() {
            // 先開相機，確保即使 FaceMesh CDN 暫時失敗也仍有即時預覽。
            try {
                await startNativeCamera();
            } catch (err) {
                console.error("相機啟動失敗:", err);

                let msg = "❌ 無法啟動相機。";
                if (err?.name === "NotAllowedError") {
                    msg += " 請允許瀏覽器 / LINE 使用相機權限後重新整理。";
                } else if (err?.name === "NotFoundError") {
                    msg += " 找不到可用的前鏡頭。";
                } else if (err?.name === "NotReadableError") {
                    msg += " 相機可能正被其他 App 使用，請關閉其他相機程式後重試。";
                } else {
                    msg += ` ${err?.message || "請確認使用 HTTPS 與相機權限。"}`;
                }

                document.getElementById("status-text").innerText = msg;
                return;
            }

            try {
                if (typeof FaceMesh === "undefined") {
                    throw new Error("MediaPipe FaceMesh SDK 載入失敗");
                }

                faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });

                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                faceMesh.onResults(onFaceMeshResults);
                startFaceMeshLoop();

            } catch (err) {
                console.error("MediaPipe 初始化失敗:", err);
                document.getElementById("status-text").innerText =
                    "⚠️ 相機已啟動，但臉部分析模組載入失敗。請檢查網路後重新整理。";
            }
        }

        // 3. 處理每影格人臉偵測與多 ROI RGB 擷取
        // 額頭 + 左右臉頰一起取樣，並排除明顯頭部移動與曝光不良影格。
        function onFaceMeshResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // MediaPipe landmarks：額頭中央、左右臉頰附近。
                const roiPoints = [landmarks[10], landmarks[50], landmarks[280]];
                const nose = landmarks[1];

                // 以鼻尖位移作為簡單 motion gate。位移太大時不把該影格送進 rPPG。
                let motionTooLarge = false;
                if (previousNosePoint) {
                    const dx = nose.x - previousNosePoint.x;
                    const dy = nose.y - previousNosePoint.y;
                    const displacement = Math.sqrt(dx * dx + dy * dy);
                    motionTooLarge = displacement > 0.010;
                }
                previousNosePoint = { x: nose.x, y: nose.y };

                let frameR = 0, frameG = 0, frameB = 0, validRois = 0;
                const roiSize = 26;

                for (const pt of roiPoints) {
                    const x = Math.floor(pt.x * canvasElement.width);
                    const y = Math.floor(pt.y * canvasElement.height);

                    canvasCtx.strokeStyle = "#1DB446";
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeRect(x - roiSize / 2, y - roiSize / 2, roiSize, roiSize);

                    const startX = Math.max(0, Math.min(canvasElement.width - roiSize, x - Math.floor(roiSize / 2)));
                    const startY = Math.max(0, Math.min(canvasElement.height - roiSize, y - Math.floor(roiSize / 2)));
                    const imgData = canvasCtx.getImageData(startX, startY, roiSize, roiSize);

                    let sumR = 0, sumG = 0, sumB = 0;
                    const totalPixels = imgData.data.length / 4;
                    for (let i = 0; i < imgData.data.length; i += 4) {
                        sumR += imgData.data[i];
                        sumG += imgData.data[i + 1];
                        sumB += imgData.data[i + 2];
                    }

                    const avgR = sumR / totalPixels;
                    const avgG = sumG / totalPixels;
                    const avgB = sumB / totalPixels;
                    const brightness = (avgR + avgG + avgB) / 3;

                    // 過暗或過曝 ROI 不採用。
                    if (brightness >= 45 && brightness <= 220) {
                        frameR += avgR;
                        frameG += avgG;
                        frameB += avgB;
                        validRois += 1;
                    }
                }

                if (isMeasuring) {
                    const now = performance.now();

                    if (motionTooLarge) {
                        rejectedMotionFrames += 1;
                        document.getElementById("status-text").innerText = "⚠️ 偵測到頭部移動，請保持不動；移動期間不會計入量測。";
                    } else if (validRois < 2) {
                        rejectedLightFrames += 1;
                        document.getElementById("status-text").innerText = "⚠️ 光線過暗或過曝，請移到光線均勻的位置。";
                    } else {
                        // 多 ROI 平均可降低單一區域陰影、表情與追蹤誤差。
                        collectedRedSignals.push(frameR / validRois);
                        collectedGreenSignals.push(frameG / validRois);
                        collectedBlueSignals.push(frameB / validRois);
                        collectedTimestamps.push(now);
                        lastSampleTime = now;
                    }

                    const currentCount = collectedGreenSignals.length;
                    const elapsedMs = now - measurementStartTime;
                    const progress = Math.min(100, (elapsedMs / TARGET_MEASUREMENT_MS) * 100);
                    document.getElementById("progress-bar").style.width = progress + "%";

                    if (!motionTooLarge && validRois >= 2) {
                        document.getElementById("status-text").innerText =
                            `⏳ 正在擷取高品質 rPPG (${Math.floor(elapsedMs / 1000)}/30 秒，${currentCount} 個有效點)... 請保持靜止`;
                    }

                    // 30 秒 + 足夠有效取樣點；最多 45 秒避免低 FPS 或偶發移動造成無限等待。
                    if ((elapsedMs >= TARGET_MEASUREMENT_MS && currentCount >= MIN_FRAMES) || elapsedMs >= MAX_MEASUREMENT_MS) {
                        isMeasuring = false;
                        processRppgAnalysis();
                    }
                }
            } else if (isMeasuring) {
                document.getElementById("status-text").innerText = "⚠️ 未穩定偵測到臉部，請面向螢幕並保持光線均勻。";
            }
            canvasCtx.restore();
        }

        window.onload = async function() {
            // LIFF 與相機彼此獨立初始化；其中一個失敗不應讓另一個完全停止。
            initLiff().catch(err => console.error("LIFF startup error:", err));
            await initFaceMesh();
        };

        // LINE WebView 切到背景再回來時，部分手機會暫停 camera track；回到頁面時自動恢復。
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                startNativeCamera().catch(err => console.error("Resume camera error:", err));
            }
        });

        window.addEventListener("pageshow", () => {
            startNativeCamera().catch(err => console.error("pageshow camera error:", err));
        });

        // 4. 開始量測按鈕觸發
        async function startMeasurement() {
            // 若頁面初次載入時相機權限被延遲，按開始量測時再嘗試一次。
            try {
                await startNativeCamera();
            } catch (err) {
                alert(`相機尚未啟動：${err?.message || err}`);
                return;
            }

            if (!faceMesh) {
                alert("臉部分析模組尚未準備完成，請確認網路後重新整理頁面。");
                return;
            }

            if (!currentUserId) {
                alert("未檢測到 LINE 帳號身份！請由 LINE 聊天室開啟。");
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(p => {
                        currentUserId = p.userId;
                        renderUserQRCode(currentUserId);
                    });
                } else {
                    liff.login();
                    return;
                }
            }

            // 重置與鎖定介面狀態
            isMeasuring = false;
            document.getElementById("start-btn").disabled = true;
            document.getElementById("report-card").style.display = "none";
            document.getElementById("progress-container").style.display = "block";
            document.getElementById("progress-bar").style.width = "0%";
            document.getElementById("status-text").innerText = "⏳ 準備中，請對準視訊畫面並保持靜止...";

            // 緩衝 300ms 確保之前的幀處理完畢後才清空陣列並開啟測量
            setTimeout(() => {
                collectedGreenSignals = [];
                collectedRedSignals = [];
                collectedBlueSignals = [];
                collectedTimestamps = [];
                previousNosePoint = null;
                rejectedMotionFrames = 0;
                rejectedLightFrames = 0;
                measurementStartTime = performance.now();
                lastSampleTime = measurementStartTime;
                isMeasuring = true;
            }, 300);
        }

        // 5. 傳送真實擷取訊號至後端（已加入前端防呆檢查，避免因未收集滿而送出極少點數）
        async function processRppgAnalysis() {
            // 防呆檢查：至少 150 個有效臉部 ROI 取樣點，約 5 秒以上。
            if (collectedGreenSignals.length < MIN_FRAMES) {
                document.getElementById("status-text").innerText = `❌ 有效採樣不足（${collectedGreenSignals.length}/${MIN_FRAMES}），請保持臉部穩定並重新量測。`;
                document.getElementById("progress-container").style.display = "none";
                document.getElementById("start-btn").disabled = false;
                isMeasuring = false;
                return;
            }

            // 依照實際第一筆到最後一筆的時間估算取樣率，不再硬編碼 30 FPS。
            const durationSec = collectedTimestamps.length >= 2
                ? (collectedTimestamps[collectedTimestamps.length - 1] - collectedTimestamps[0]) / 1000
                : 0;
            const estimatedFps = durationSec > 0
                ? Math.min(60, Math.max(10, (collectedTimestamps.length - 1) / durationSec))
                : 30;

            document.getElementById("status-text").innerText = `🔄 訊號擷取完成（${collectedGreenSignals.length} 個有效點 / ${estimatedFps.toFixed(1)} FPS；移動排除 ${rejectedMotionFrames} 幀），正在進行 POS rPPG 分析...`;
            document.getElementById("progress-container").style.display = "none";

            const payload = {
                user_line_id: currentUserId,
                id_token: (typeof liff !== "undefined" && liff.isLoggedIn()) ? liff.getIDToken() : null,
                rgb_signals: [collectedRedSignals, collectedGreenSignals, collectedBlueSignals],
                fps: Number(estimatedFps.toFixed(2)),
                monitoring_mode: getMonitoringMode()
            };

            try {
                const response = await fetch("/api/v1/analyze-rppg", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json().catch(() => ({ detail: `HTTP ${response.status}` }));
                if (response.ok && result.status === "success" && result.data) {
                    const data = result.data;
                    document.getElementById("status-text").innerText = "✅ 真實生理量測完成！報告已發送至 LINE。";

                    const reportCard = document.getElementById("report-card");
                    reportCard.className = "report-card " + (data.health_light === "RED" ? "red" : (data.health_light === "YELLOW" ? "yellow" : ""));
                    document.getElementById("report-title").innerText = (data.health_light === "RED" ? "🔴" : (data.health_light === "YELLOW" ? "🟡" : "🟢")) + " 生理量測結果";
                    const qLabel = data.signal_quality_label === "GOOD" ? "良好" : (data.signal_quality_label === "FAIR" ? "普通" : "需重測");
                    const modeReasons = Array.isArray(data.mode_alert_reasons)
                        ? data.mode_alert_reasons.join("、")
                        : (data.mode_alert_reasons || "目前無模式特定警示");
                    document.getElementById("report-metrics").innerText =
                        `🩺 模式：${data.monitoring_mode_label || monitoringModeInfo[getMonitoringMode()].label}\n` +
                        `🎯 模式提示：${modeReasons}\n` +
                        `❤️ 心率：${data.heart_rate} BPM\n` +
                        `💓 HRV：SDNN ${data.hrv_sdnn ?? "--"} ms｜RMSSD ${data.hrv_rmssd ?? "--"} ms\n` +
                        `🫁 呼吸頻率：${data.respiratory_rate ?? "需較佳訊號"} 次/分\n` +
                        `〰️ 脈搏不規則風險：${data.irregular_pulse_score ?? "--"} / 100\n` +
                        `📶 訊號品質：${data.signal_quality ?? "--"} / 100（${qLabel}）\n` +
                        `🩸 SpO₂：${data.spo2_experimental ?? "需較佳訊號"}%（實驗性、未校正）\n` +
                        `📊 壓力指數：${data.stress_score} / 100`;
                    document.getElementById("report-summary").innerText = "📝 檢測摘要：\n" + data.summary;
                    document.getElementById("report-advice").innerText = "💡 處置建議：\n" + data.action_advice;
                    reportCard.style.display = "block";
                } else {
                    document.getElementById("status-text").innerText = "❌ 分析失敗: " + (result.detail || result.message || JSON.stringify(result));
                }
            } catch (err) {
                console.error("API 請求錯誤:", err);
                document.getElementById("status-text").innerText = "⚠️ 網路傳送失敗，請重試。";
            } finally {
                document.getElementById("start-btn").disabled = false;
            }
        }

        // 跨瀏覽器相容日期格式化解析
        function parseDateString(dateStr) {
            if (!dateStr) return "未知";
            const formattedStr = dateStr.replace(/-/g, "/").replace("T", " ");
            const d = new Date(formattedStr);
            if (isNaN(d.getTime())) return "未知";
            const month = d.getMonth() + 1;
            const date = d.getDate();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${month}/${date} ${hours}:${minutes}`;
        }

        // 6. 繪製心率歷史趨勢圖 (相容 Chart.js v4)
        function renderHeartRateChart(historyData) {
            const ctx = document.getElementById('heartRateChart').getContext('2d');
            
            const sortedData = [...historyData].reverse();
            const labels = sortedData.map(item => parseDateString(item.created_at));
            const heartRates = sortedData.map(item => item.heart_rate);

            if (historyChartInstance) {
                historyChartInstance.destroy();
            }

            historyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '心率 (BPM)',
                        data: heartRates,
                        borderColor: '#1DB446',
                        backgroundColor: 'rgba(29, 180, 70, 0.1)',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: '#166534',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 40,
                            max: 140,
                            title: { display: true, text: 'BPM' }
                        },
                        x: {
                            ticks: { maxRotation: 45, font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // 7. 載入並顯示歷史紀錄
        async function fetchAndShowHistory() {
            const modal = document.getElementById("history-modal");
            const historyList = document.getElementById("history-list");
            modal.style.display = "block";
            historyList.innerHTML = "<p style='text-align:center; color:#888;'>載入歷史紀錄中...</p>";

            if (!currentUserId) {
                historyList.innerHTML = "<p style='text-align:center; color:#e11d48;'>尚未取得使用者身份，請重新從 LINE 開啟。</p>";
                return;
            }

            try {
                const res = await fetch(`/api/v1/user/history/${currentUserId}`);
                const data = await res.json();

                if (data.status === "success" && data.history && data.history.length > 0) {
                    renderHeartRateChart(data.history);

                    historyList.innerHTML = "";
                    data.history.forEach(item => {
                        const lightIcon = item.health_light === "RED" ? "🔴" : (item.health_light === "YELLOW" ? "🟡" : "🟢");
                        const dateStr = parseDateString(item.created_at);
                        
                        const div = document.createElement("div");
                        div.className = "history-item";
                        div.innerHTML = `
                            <div class="history-date">📅 ${dateStr}</div>
                            <div class="history-body">
                                ${lightIcon} 心率: ${item.heart_rate} BPM | 呼吸: ${item.respiratory_rate ?? "--"} 次/分 | RMSSD: ${item.hrv_rmssd ?? "--"} ms | 品質: ${item.signal_quality ?? "--"}/100 | 壓力: ${item.stress_score} / 100
                            </div>
                            <div style="font-size:12px; color:#555; margin-top:4px;">${item.summary || ''}</div>
                        `;
                        historyList.appendChild(div);
                    });
                } else {
                    historyList.innerHTML = "<p style='text-align:center; color:#888;'>尚無歷史量測紀錄。</p>";
                    if (historyChartInstance) {
                        historyChartInstance.destroy();
                    }
                }
            } catch (err) {
                console.error("取得歷史紀錄失敗:", err);
                historyList.innerHTML = "<p style='text-align:center; color:#e11d48;'>讀取歷史紀錄失敗，請檢查網路連線。</p>";
            }
        }

        function closeHistoryModal() {
            document.getElementById("history-modal").style.display = "none";
        }

        function handleModalOutsideClick(event) {
            if (event.target.id === "history-modal") {
                closeHistoryModal();
            }
        }
    </script>
</body>
</html>
