<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmPulse - rPPG 健康檢測</title>
  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; color: #1DB446; margin-bottom: 8px; }
    p.subtitle { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
    
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 鏡像顯示 */
    }
    canvas { display: none; }

    /* 臉部對齊框內引導 */
    .face-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 70%;
      border: 3px dashed rgba(27, 180, 70, 0.8);
      border-radius: 50%;
      pointer-events: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background-color: #1DB446;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }
    
    .status-card {
      margin-top: 20px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #1DB446;
      text-align: left;
    }
    .status-card h3 { font-size: 1rem; margin-bottom: 6px; }
    .status-card p { font-size: 0.9rem; color: #555; }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #1DB446;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>PharmPulse 健康量測</h1>
  <p class="subtitle">請將臉部對準框線，維持靜止進行光學心率分析</p>

  <div class="video-wrapper">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="face-overlay"></div>
  </div>
  
  <canvas id="canvas"></canvas>

  <button id="startBtn" class="btn" onclick="startMeasurement()">開始 5 秒心率量測</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status-card" id="resultCard" style="display:none;">
    <h3 id="resultTitle">分析結果</h3>
    <p id="resultBpm">心率: -- BPM</p>
    <p id="resultStatus">評估: --</p>
  </div>
</div>

<script>
  const MY_LIFF_ID = "2011686844-4moxcFdy"; // 你的 LIFF ID
  let userLineId = "U_GUEST_TESTER";
  let video, canvas, ctx;
  let greenSignals = [];
  let isMeasuring = false;
  const TARGET_SAMPLES = 150; // 5 秒 (30 fps * 5)
  let animationFrameId;

  async function initLIFF() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        userLineId = profile.userId;
      } else {
        liff.login();
      }
    } catch (err) {
      console.warn("LIFF 初始化失敗或在瀏覽器獨立環境測試:", err);
    }
  }

  async function initCamera() {
    video = document.getElementById("webcam");
    canvas = document.getElementById("canvas");
    ctx = canvas.getContext("2d");

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
    } catch (err) {
      alert("無法存取視訊鏡頭，請確認已授予權限。");
    }
  }

  function startMeasurement() {
    if (isMeasuring) return;
    
    isMeasuring = true;
    greenSignals = [];
    
    const btn = document.getElementById("startBtn");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const resultCard = document.getElementById("resultCard");

    btn.disabled = true;
    btn.innerText = "量測中，請保持靜止...";
    progressBar.style.display = "block";
    progressFill.style.width = "0%";
    resultCard.style.display = "none";

    captureFrame();
  }

  function captureFrame() {
    if (!isMeasuring) return;

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // 擷取中心 ROI (臉部區域) 的綠光通道均值
    const roiWidth = Math.floor(canvas.width * 0.3);
    const roiHeight = Math.floor(canvas.height * 0.3);
    const roiX = Math.floor((canvas.width - roiWidth) / 2);
    const roiY = Math.floor((canvas.height - roiHeight) / 2);

    const frameData = ctx.getImageData(roiX, roiY, roiWidth, roiHeight).data;
    let greenSum = 0;
    let pixelCount = 0;

    for (let i = 0; i < frameData.length; i += 4) {
      greenSum += frameData[i + 1]; // G 通道
      pixelCount++;
    }

    const avgGreen = greenSum / pixelCount;
    greenSignals.push(avgGreen);

    // 更新進度條
    const progressPercent = Math.min(100, (greenSignals.length / TARGET_SAMPLES) * 100);
    document.getElementById("progressFill").style.width = progressPercent + "%";

    if (greenSignals.length < TARGET_SAMPLES) {
      animationFrameId = requestAnimationFrame(captureFrame);
    } else {
      finishMeasurement();
    }
  }

  async function finishMeasurement() {
    isMeasuring = false;
    const btn = document.getElementById("startBtn");
    btn.innerText = "分析中...";

    try {
      const response = await fetch("/api/v1/analyze-rppg", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_line_id: userLineId,
          green_signals: greenSignals,
          fps: 30
        })
      });

      const resData = await response.json();

      if (response.ok) {
        document.getElementById("resultTitle").innerText = "分析完成！";
        
        // 處理不同後端資料結構之相容
        const hr = resData.heart_rate || (resData.data && resData.data.heart_rate) || "--";
        document.getElementById("resultBpm").innerText = `心率: ${hr} BPM`;
        
        const summary = resData.message || (resData.data && resData.data.summary) || "檢測成功";
        document.getElementById("resultStatus").innerText = `狀態: ${summary}`;
        document.getElementById("resultCard").style.display = "block";
      } else {
        alert("分析失敗: " + (resData.detail || "伺服器錯誤"));
      }
    } catch (err) {
      alert("網路連線錯誤，請稍後再試。");
    } finally {
      btn.disabled = false;
      btn.innerText = "重新量測";
      document.getElementById("progressBar").style.display = "none";
    }
  }

  window.onload = () => {
    initLIFF();
    initCamera();
  };
</script>
</body>
</html>
