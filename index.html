<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmPulse - rPPG 量測</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- MediaPipe Face Mesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f8f9fa; margin: 0; padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { color: #1DB954; margin-bottom: 8px; }
    .video-wrapper { position: relative; width: 320px; height: 320px; margin: 15px auto; border-radius: 50%; overflow: hidden; border: 4px solid #1DB954; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; background: #e9ecef; color: #495057; margin-bottom: 10px; }
    .btn { background: #1DB954; color: white; border: none; padding: 12px 28px; border-radius: 24px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 280px; }
    .btn:disabled { background: #adb5bd; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h2>PharmPulse 脈搏量測</h2>
    <p style="color: #6c757d; font-size: 14px;">請將臉部置於框內並保持靜止</p>
    
    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div id="status" class="status-badge">初始化鏡頭與臉部偵測...</div>
    <br>
    <button id="start-btn" class="btn" disabled onclick="startMeasurement()">開始 10 秒量測</button>
  </div>

  <script>
    let userLineId = "U_TEST_USER";
    let isFaceDetected = false;
    let isMeasuring = false;
    let rgbSignals = [[], [], []]; // [Red, Green, Blue]
    let frameCount = 0;

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');

    // 初始化 LIFF
    async function initLIFF() {
      try {
        await liff.init({ liffId: "YOUR_LIFF_ID" }); // 替換為你的 LIFF ID
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userLineId = profile.userId;
        }
      } catch (err) {
        console.log("LIFF Init Skip / Browser Mode", err);
      }
    }
    initLIFF();

    // 設定 MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        isFaceDetected = true;
        const landmarks = results.multiFaceLandmarks[0];

        if (!isMeasuring) {
          statusText.innerText = "臉部已對準，請點擊開始量測";
          statusText.style.background = "#d4edda";
          statusText.style.color = "#155724";
          startBtn.disabled = false;
        }

        // 取額頭區域特徵點 (Keypoint 10 附近) 進行 RGB 訊號採樣
        if (isMeasuring) {
          sampleROIColor(landmarks);
        }
      } else {
        isFaceDetected = false;
        if (!isMeasuring) {
          statusText.innerText = "未偵測到臉部，請對準鏡頭";
          statusText.style.background = "#f8d7da";
          statusText.style.color = "#721c24";
          startBtn.disabled = true;
        }
      }
      canvasCtx.restore();
    }

    // 從額頭 ROI 區域抽取平均 RGB 值
    function sampleROIColor(landmarks) {
      const foreheadIndex = 10; // 額頭中心點
      const x = Math.floor(landmarks[foreheadIndex].x * canvasElement.width);
      const y = Math.floor(landmarks[foreheadIndex].y * canvasElement.height);
      
      // 擷取 20x20 像素小區域
      try {
        const imgData = canvasCtx.getImageData(Math.max(0, x - 10), Math.max(0, y - 10), 20, 20);
        let rSum = 0, gSum = 0, bSum = 0;
        const totalPixels = imgData.data.length / 4;

        for (let i = 0; i < imgData.data.length; i += 4) {
          rSum += imgData.data[i];
          gSum += imgData.data[i + 1];
          bSum += imgData.data[i + 2];
        }

        rgbSignals[0].push(rSum / totalPixels);
        rgbSignals[1].push(gSum / totalPixels);
        rgbSignals[2].push(bSum / totalPixels);
      } catch (e) {
        console.error("ROI sampling error", e);
      }
    }

    // 啟動攝影機
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();

    // 開始 10 秒量測流程
    async function startMeasurement() {
      if (!isFaceDetected) return;

      isMeasuring = true;
      startBtn.disabled = true;
      rgbSignals = [[], [], []];
      
      let countdown = 10;
      statusText.style.background = "#fff3cd";
      statusText.style.color = "#856404";

      const timer = setInterval(() => {
        countdown--;
        statusText.innerText = `量測中... 剩餘 ${countdown} 秒 (請保持靜止)`;

        if (countdown <= 0) {
          clearInterval(timer);
          isMeasuring = false;
          submitData();
        }
      }, 1000);
    }

    // 送出數據至 API
    async function submitData() {
      statusText.innerText = "分析中，請稍候...";
      try {
        const response = await fetch('/api/v1/analyze-rppg', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_line_id: userLineId,
            rgb_signals: rgbSignals,
            fps: 30
          })
        });

        const resData = await response.json();
        if (resData.status === "success") {
          statusText.innerText = `量測完成！心率：${resData.data.heart_rate} BPM`;
          statusText.style.background = "#d4edda";
          statusText.style.color = "#155724";
          alert(`量測成功！\n心率：${resData.data.heart_rate} BPM\n請至 LINE 聊天室查看趨勢圖報告。`);
        } else {
          throw new Error("API error");
        }
      } catch (err) {
        statusText.innerText = "分析失敗，請重新嘗試";
        statusText.style.background = "#f8d7da";
        alert("網路連線或分析發生錯誤，請重試");
      } finally {
        startBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
