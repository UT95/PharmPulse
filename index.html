<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmPulse 生理量測</title>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- MediaPipe Face Mesh SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; color: #333; padding: 20px; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1DB446; margin-bottom: 8px; font-size: 22px; }
        .user-info { font-size: 14px; color: #666; margin-bottom: 12px; background: #eef9f2; padding: 8px 12px; border-radius: 8px; display: inline-block; }
        
        .nav-actions { margin-bottom: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn-secondary { background-color: #ffffff; color: #1DB446; border: 1.5px solid #1DB446; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-secondary:active { background-color: #eef9f2; transform: scale(0.98); }

        /* QR Code 卡片樣式 */
        .qrcode-card { display: none; background: #f0fdf4; border: 1.5px dashed #1DB446; border-radius: 12px; padding: 16px; margin-bottom: 16px; text-align: center; transition: all 0.3s ease; }
        .qrcode-title { font-weight: bold; color: #166534; font-size: 15px; margin-bottom: 4px; }
        .qrcode-sub { font-size: 12px; color: #666; margin-bottom: 10px; }
        .qrcode-box { display: inline-flex; justify-content: center; align-items: center; margin: 10px 0; background: #ffffff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .qrcode-id { font-size: 12px; color: #333; background: #e2e8f0; padding: 4px 10px; border-radius: 6px; display: inline-block; font-family: monospace; font-weight: 600; }

        /* 視訊與人臉綠光 ROI 區域 */
        .camera-container { position: relative; width: 280px; height: 280px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; background-color: #000; border: 4px solid #1DB446; box-shadow: 0 8px 16px rgba(29, 180, 70, 0.2); }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 4px dashed rgba(255, 255, 255, 0.85); border-radius: 50%; pointer-events: none; box-sizing: border-box; animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { border-color: rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3); }
            50% { border-color: rgba(29, 180, 70, 1); box-shadow: inset 0 0 25px rgba(29, 180, 70, 0.6); }
            100% { border-color: rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3); }
        }

        .progress-bar-container { width: 100%; background-color: #e5e7eb; border-radius: 8px; height: 10px; margin-bottom: 15px; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 100%; background-color: #1DB446; transition: width 0.1s linear; }

        .btn { width: 100%; padding: 14px; background-color: #1DB446; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .btn:active { background-color: #159338; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .status { margin-top: 15px; font-size: 15px; color: #555; font-weight: 500; min-height: 22px; }

        .report-card { display: none; margin-top: 20px; padding: 16px; border-radius: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; text-align: left; }
        .report-card.yellow { background: #fefce8; border-color: #fef08a; }
        .report-card.red { background: #fef2f2; border-color: #fecaca; }
        .report-title { font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #166534; }
        .report-metric { font-size: 15px; margin-bottom: 6px; }
        .report-section { margin-top: 10px; font-size: 14px; line-height: 1.5; white-space: pre-line; }

        /* 歷史紀錄彈窗 Modal CSS */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 20px; border-radius: 16px; width: 90%; max-width: 440px; max-height: 80vh; overflow-y: auto; text-align: left; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { font-size: 24px; font-weight: bold; cursor: pointer; color: #888; }
        .history-item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .history-date { font-size: 12px; color: #888; margin-bottom: 4px; }
        .history-body { font-size: 14px; font-weight: bold; color: #333; }
        .chart-container { position: relative; height: 200px; width: 100%; margin-bottom: 15px; padding: 10px; background: #fafafa; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>PharmPulse 生理檢測</h2>
        <div id="user-info" class="user-info">連線中...</div>
        
        <div class="nav-actions">
            <button class="btn-secondary" onclick="toggleQrCode()">📱 出示藥局條碼</button>
            <button class="btn-secondary" onclick="fetchAndShowHistory()">📊 查看歷史紀錄</button>
        </div>

        <!-- 專屬 LINE ID QR Code 卡片 -->
        <div id="qrcode-card" class="qrcode-card">
            <div class="qrcode-title">🏥 社區藥局專屬關懷 QR Code</div>
            <div class="qrcode-sub">前往藥局時，請出示此條碼供藥師掃描調閱紀錄</div>
            <div class="qrcode-box">
                <div id="qrcode-container"></div>
            </div>
            <div>
                <span id="display-line-id" class="qrcode-id">ID: 載入中...</span>
            </div>
        </div>

        <div class="camera-container">
            <video id="webcam" playsinline muted></video>
            <canvas id="output-canvas" width="640" height="640"></canvas>
            <div class="face-overlay"></div>
        </div>

        <div id="progress-container" class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <button id="start-btn" class="btn" onclick="startMeasurement()">開始真實生理量測</button>
        <p id="status-text" class="status">請對準頭部並保持靜止，點擊按鈕開始量測</p>

        <div id="report-card" class="report-card">
            <div id="report-title" class="report-title">🟢 量測結果報告</div>
            <div id="report-metrics" class="report-metric"></div>
            <hr style="margin: 8px 0; border: none; border-top: 1px solid rgba(0,0,0,0.1);">
            <div id="report-summary" class="report-section"></div>
            <div id="report-advice" class="report-section" style="font-weight: 500;"></div>
        </div>
    </div>

    <!-- 歷史紀錄 Modal -->
    <div id="history-modal" class="modal" onclick="handleModalOutsideClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📊 歷史量測紀錄</h3>
                <span class="close-btn" onclick="closeHistoryModal()">&times;</span>
            </div>

            <!-- 📈 心率趨勢圖畫布容器 -->
            <div class="chart-container">
                <canvas id="heartRateChart"></canvas>
            </div>

            <div id="history-list">
                <p style="text-align:center; color:#888;">讀取中...</p>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = "";
        let historyChartInstance = null;
        
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
        
        let faceMesh;
        let isMeasuring = false;
        let collectedGreenSignals = [];
        let collectedRedSignals = [];
        const TOTAL_FRAMES = 300;

        // 生成 LINE ID QR Code
        function renderUserQRCode(userLineId) {
            const container = document.getElementById("qrcode-container");
            const displayId = document.getElementById("display-line-id");

            if (!container || !userLineId) return;

            container.innerHTML = "";
            if (displayId) {
                displayId.textContent = `ID: ${userLineId}`;
            }

            new QRCode(container, {
                text: userLineId,
                width: 160,
                height: 160,
                colorDark: "#166534",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // 切換顯示/隱藏 QR Code 卡片
        function toggleQrCode() {
            const card = document.getElementById("qrcode-card");
            card.style.display = (card.style.display === "none" || card.style.display === "") ? "block" : "none";
        }

        // 1. 初始化 LIFF 並判斷 URL 參數
        async function initLiff() {
            try {
                await liff.init({ liffId: '2011686844-4moxcFdy' }); 

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                currentUserId = profile.userId;
                document.getElementById("user-info").innerText = "👤 已連線: " + profile.displayName;

                renderUserQRCode(currentUserId);

                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('page') === 'history') {
                    fetchAndShowHistory();
                }

            } catch (err) {
                console.error("LIFF 初始化失敗:", err);
                document.getElementById("user-info").innerText = "⚠️ 請由 LINE App 內開啟此頁面";
            }
        }

        // 2. 初始化 MediaPipe Face Mesh
        function initFaceMesh() {
            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onFaceMeshResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 640,
                height: 640
            });
            camera.start();
        }

        // 3. 處理每影格人臉偵測與綠光擷取
        function onFaceMeshResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                const foreheadPt = landmarks[10]; // 額頭特徵點
                
                // Canvas 畫布上有 css transform scaleX(-1) 進行鏡像顯示
                // MediaPipe 的 x 座標在繪製時需轉為內部像素座標
                const x = Math.floor(foreheadPt.x * canvasElement.width);
                const y = Math.floor(foreheadPt.y * canvasElement.height);

                canvasCtx.fillStyle = "#1DB446";
                canvasCtx.beginPath();
                canvasCtx.arc(x, y, 6, 0, 2 * Math.PI);
                canvasCtx.fill();

                if (isMeasuring) {
                    const roiSize = 20;
                    // getImageData 取的是原始未經過 CSS 翻轉的 Canvas 陣列資料
                    const imgData = canvasCtx.getImageData(
                        Math.max(0, Math.min(canvasElement.width - roiSize, x - roiSize / 2)), 
                        Math.max(0, Math.min(canvasElement.height - roiSize, y - roiSize / 2)), 
                        roiSize, roiSize
                    );

                    let sumG = 0, sumR = 0;
                    const totalPixels = imgData.data.length / 4;

                    for (let i = 0; i < imgData.data.length; i += 4) {
                        sumR += imgData.data[i];     // Red
                        sumG += imgData.data[i + 1]; // Green
                    }

                    collectedGreenSignals.push(sumG / totalPixels);
                    collectedRedSignals.push(sumR / totalPixels);

                    const progress = (collectedGreenSignals.length / TOTAL_FRAMES) * 100;
                    document.getElementById("progress-bar").style.width = progress + "%";

                    if (collectedGreenSignals.length >= TOTAL_FRAMES) {
                        isMeasuring = false;
                        processRppgAnalysis();
                    }
                }
            } else if (isMeasuring) {
                document.getElementById("status-text").innerText = "⚠️ 請面向螢幕並保持額頭未被遮擋！";
            }
            canvasCtx.restore();
        }

        window.onload = function() {
            initLiff();
            initFaceMesh();
        };

        // 4. 開始量測按鈕觸發
        function startMeasurement() {
            if (!currentUserId) {
                alert("未檢測到 LINE 帳號身份！請由 LINE 聊天室開啟。");
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(p => {
                        currentUserId = p.userId;
                        renderUserQRCode(currentUserId);
                    });
                } else {
                    liff.login();
                    return;
                }
            }

            document.getElementById("start-btn").disabled = true;
            document.getElementById("report-card").style.display = "none";
            document.getElementById("progress-container").style.display = "block";
            document.getElementById("progress-bar").style.width = "0%";
            document.getElementById("status-text").innerText = "⏳ 正在即時擷取額頭皮膚綠光微血管變化，請保持靜止 (約 10 秒)...";

            collectedGreenSignals = [];
            collectedRedSignals = [];
            isMeasuring = true;
        }

        // 5. 傳送真實擷取訊號至後端
        async function processRppgAnalysis() {
            document.getElementById("status-text").innerText = "🔄 訊號擷取完成，正在進行演算法分析...";
            document.getElementById("progress-container").style.display = "none";

            const payload = {
                user_line_id: currentUserId,
                rgb_signals: [collectedRedSignals, collectedGreenSignals],
                fps: 30
            };

            try {
                const response = await fetch("/api/v1/analyze-rppg", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.status === "success" && result.data) {
                    const data = result.data;
                    document.getElementById("status-text").innerText = "✅ 真實生理量測完成！報告已發送至 LINE。";

                    const reportCard = document.getElementById("report-card");
                    reportCard.className = "report-card " + (data.health_light === "RED" ? "red" : (data.health_light === "YELLOW" ? "yellow" : ""));
                    document.getElementById("report-title").innerText = (data.health_light === "RED" ? "🔴" : (data.health_light === "YELLOW" ? "🟡" : "🟢")) + " 生理量測結果";
                    document.getElementById("report-metrics").innerText = `❤️ 心率：${data.heart_rate} BPM | 📊 壓力指數：${data.stress_score} / 100`;
                    document.getElementById("report-summary").innerText = "📝 檢測摘要：\n" + data.summary;
                    document.getElementById("report-advice").innerText = "💡 處置建議：\n" + data.action_advice;
                    reportCard.style.display = "block";
                } else {
                    document.getElementById("status-text").innerText = "❌ 分析失敗: " + (result.message || JSON.stringify(result));
                }
            } catch (err) {
                console.error("API 請求錯誤:", err);
                document.getElementById("status-text").innerText = "⚠️ 網路傳送失敗，請重試。";
            } finally {
                document.getElementById("start-btn").disabled = false;
            }
        }

        // 6. 繪製心率歷史趨勢圖 (相容 Chart.js v4)
        function renderHeartRateChart(historyData) {
            const ctx = document.getElementById('heartRateChart').getContext('2d');
            
            const sortedData = [...historyData].reverse();
            const labels = sortedData.map(item => {
                if (!item.created_at) return "未知";
                const d = new Date(item.created_at);
                const month = d.getMonth() + 1;
                const date = d.getDate();
                const hours = String(d.getHours()).padStart(2, '0');
                const minutes = String(d.getMinutes()).padStart(2, '0');
                return `${month}/${date} ${hours}:${minutes}`;
            });
            const heartRates = sortedData.map(item => item.heart_rate);

            if (historyChartInstance) {
                historyChartInstance.destroy();
            }

            historyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '心率 (BPM)',
                        data: heartRates,
                        borderColor: '#1DB446',
                        backgroundColor: 'rgba(29, 180, 70, 0.1)',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: '#166534',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 40,
                            max: 140,
                            title: { display: true, text: 'BPM' }
                        },
                        x: {
                            ticks: { maxRotation: 45, font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // 7. 載入並顯示歷史紀錄
        async function fetchAndShowHistory() {
            const modal = document.getElementById("history-modal");
            const historyList = document.getElementById("history-list");
            modal.style.display = "block";
            historyList.innerHTML = "<p style='text-align:center; color:#888;'>載入歷史紀錄中...</p>";

            if (!currentUserId) {
                historyList.innerHTML = "<p style='text-align:center; color:#e11d48;'>尚未取得使用者身份，請重新從 LINE 開啟。</p>";
                return;
            }

            try {
                const res = await fetch(`/api/v1/user/history/${currentUserId}`);
                const data = await res.json();

                if (data.status === "success" && data.history && data.history.length > 0) {
                    renderHeartRateChart(data.history);

                    historyList.innerHTML = "";
                    data.history.forEach(item => {
                        const lightIcon = item.health_light === "RED" ? "🔴" : (item.health_light === "YELLOW" ? "🟡" : "🟢");
                        const dateStr = item.created_at ? new Date(item.created_at).toLocaleString("zh-TW") : "未知時間";
                        
                        const div = document.createElement("div");
                        div.className = "history-item";
                        div.innerHTML = `
                            <div class="history-date">📅 ${dateStr}</div>
                            <div class="history-body">
                                ${lightIcon} 心率: ${item.heart_rate} BPM | 壓力: ${item.stress_score} / 100
                            </div>
                            <div style="font-size:12px; color:#555; margin-top:4px;">${item.summary || ''}</div>
                        `;
                        historyList.appendChild(div);
                    });
                } else {
                    historyList.innerHTML = "<p style='text-align:center; color:#888;'>尚無歷史量測紀錄。</p>";
                    if (historyChartInstance) {
                        historyChartInstance.destroy();
                    }
                }
            } catch (err) {
                console.error("取得歷史紀錄失敗:", err);
                historyList.innerHTML = "<p style='text-align:center; color:#e11d48;'>讀取歷史紀錄失敗，請檢查網路連線。</p>";
            }
        }

        function closeHistoryModal() {
            document.getElementById("history-modal").style.display = "none";
        }

        function handleModalOutsideClick(event) {
            if (event.target.id === "history-modal") {
                closeHistoryModal();
            }
        }
    </script>
</body>
</html>
