<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmPulse 生理量測</title>
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .btn { padding: 12px 24px; background-color: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .status { margin-top: 15px; color: #555; }
    </style>
</head>
<body>

    <h2>PharmPulse 生理檢測</h2>
    <p id="user-info">載入使用者資訊中...</p>
    
    <button class="btn" onclick="startMeasurement()">開始量測 (測試傳送)</button>
    <p id="status-text" class="status"></p>

    <script>
        let currentUserId = "";

        // 1. 初始化 LIFF 取得真實 LINE User ID
        async function initLiff() {
            try {
                // ⚠️ 請將 YOUR_LIFF_ID 替換為你在 LINE Developers 後台設定的真實 LIFF ID
                await liff.init({ liffId: "YOUR_LIFF_ID" }); 

                // 若未登入 LINE 身份，自動引導登入
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // 取得使用者 Profile 資料
                const profile = await liff.getProfile();
                currentUserId = profile.userId; // 取得真實 U 開頭 33 碼 ID
                document.getElementById("user-info").innerText = "已連線 LINE 帳號: " + profile.displayName;
                console.log("成功取得真實 LINE User ID:", currentUserId);
            } catch (err) {
                console.error("LIFF 初始化失敗:", err);
                document.getElementById("user-info").innerText = "⚠️ 請使用 LINE App 開啟此頁面以開啟推播功能。";
            }
        }

        window.onload = function() {
            initLiff();
        };

        // 2. 發送量測資料給後端 API
        async function startMeasurement() {
            // 檢查是否取得真實 LINE User ID (必須為 U 開頭且長度 33 碼)
            if (!currentUserId || currentUserId === "U_TEST_USER" || !currentUserId.startsWith("U")) {
                alert("未檢測到 LINE 帳號身份！系統將導向登入頁面，請登入後重新量測。");
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentUserId = profile.userId;
                } else {
                    liff.login();
                    return;
                }
            }

            document.getElementById("status-text").innerText = "分析中，請稍候...";

            // 模擬 RGB 訊號數據
            const mockRgbSignals = [
                Array.from({length: 100}, () => Math.random() * 10),
                Array.from({length: 100}, () => Math.sin(Date.now()) * 5 + 50)
            ];

            const payload = {
                user_line_id: currentUserId, // 傳送真實的 U 開頭 User ID
                rgb_signals: mockRgbSignals,
                fps: 30
            };

            try {
                const response = await fetch("/api/v1/analyze-rppg", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.status === "success") {
                    document.getElementById("status-text").innerText = "分析完成！請查看 LINE 聊天室訊息推播。";
                } else {
                    document.getElementById("status-text").innerText = "分析失敗: " + JSON.stringify(result);
                }
            } catch (err) {
                console.error("API 請求錯誤:", err);
                document.getElementById("status-text").innerText = "網路發送失敗，請重試。";
            }
        }
    </script>
</body>
</html>
